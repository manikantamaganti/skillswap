<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration – SkillSwap</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔄</text></svg>">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Public Navbar -->
  <header class="public-nav">
    <div class="container nav-flex">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">🔄</div>
        <div>Skill<span>Swap</span></div>
      </a>
      <div style="display: flex; gap: 0.75rem;">
        <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
      </div>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; background: var(--gradient-subtle);">
    <div class="card" style="width: 100%; max-width: 560px; padding: 2.5rem; box-shadow: var(--shadow-xl); border: 1px solid var(--border);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 48px; height: 48px; font-size: 1.5rem;">🔄</div>
        <h2 style="font-size: 1.85rem; margin-bottom: 0.35rem;">Create Student Account</h2>
        <p style="color: var(--text-muted); font-size: 0.92rem;">Join the peer learning community to trade skills</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="full_name">Full Name *</label>
          <input type="text" id="full_name" class="form-control" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">College Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. rahul@college.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="college_name">College / University Name *</label>
          <input type="text" id="college_name" class="form-control" placeholder="e.g. National Institute of Technology" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="department">Department / Branch *</label>
            <input type="text" id="department" class="form-control" placeholder="e.g. Computer Science" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="year_of_study">Year of Study *</label>
            <select id="year_of_study" class="form-control" required>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year" selected>2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
              <option value="Postgraduate">Postgraduate</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password *</label>
            <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password *</label>
            <input type="password" id="confirm_password" class="form-control" placeholder="Re-enter password" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="profile_image">Profile Picture / Avatar Preset (Optional)</label>
          <select id="profile_image" class="form-control">
            <option value="default_avatar.png">Default Blue Style</option>
            <option value="avatar1.png">Avatar Style 1 (Royal Blue)</option>
            <option value="avatar2.png">Avatar Style 2 (Purple)</option>
            <option value="avatar3.png">Avatar Style 3 (Emerald)</option>
            <option value="avatar4.png">Avatar Style 4 (Amber)</option>
            <option value="avatar5.png">Avatar Style 5 (Crimson)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="reg-submit-btn" style="margin-top: 1rem;">
          Register Account ➔
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="font-weight: 700;">Sign in here</a>
      </div>
    </div>
  </main>

  <footer style="text-align: center; padding: 1.5rem; font-size: 0.85rem; color: var(--text-light); border-top: 1px solid var(--border);">
    &copy; 2026 SkillSwap Platform. Secure Student Skill Exchange.
  </footer>

  <script src="js/script.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const college_name = document.getElementById('college_name').value.trim();
      const department = document.getElementById('department').value.trim();
      const year_of_study = document.getElementById('year_of_study').value;
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirm_password').value;
      const profile_image = document.getElementById('profile_image').value;
      const btn = document.getElementById('reg-submit-btn');

      if (password !== confirm_password) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      if (password.length < 6) {
        showToast('Password must be at least 6 characters long.', 'warning');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Registering...';

      const res = await apiCall('/api/auth/register', {
        method: 'POST',
        data: { full_name, email, college_name, department, year_of_study, password, confirm_password, profile_image }
      });

      btn.disabled = false;
      btn.textContent = 'Register Account ➔';

      if (res.ok && res.success) {
        showToast(res.message, 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      } else {
        showToast(res.message || 'Registration failed.', 'error');
      }
    });
  </script>
</body>
</html>
